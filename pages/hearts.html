<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unlock My Heart ❤️</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body class="heart-page">

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
        <span>❤</span>
    </div>

    <div class="overlay"></div>

    <section class="heart-container">

        <div class="glass heart-box">

            <h1>My Heart Has 6 Secrets ❤️</h1>

            <p class="instruction">
                Every click unlocks a little piece of my heart.<br>
                Tap the heart below to begin. ❤️
            </p>

            <div id="mainHeart" class="main-heart">
                ❤️
            </div>

            <div id="messageBox" class="message-box">

                <h3 id="secretTitle">
                    Tap my heart ❤️
                </h3>

                <p id="secretText">
                    I'm waiting to tell you something special...
                </p>

            </div>

            <button
                id="finalBtn"
                class="hidden-btn"
                onclick="window.location.href='ending.html'">

                🎁 Final Surprise

            </button>

        </div>

    </section>

    <script src="../js/script.js"></script>

</body>
</html>
